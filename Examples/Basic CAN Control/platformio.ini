; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32G431CB]
platform = ststm32
board = genericSTM32G431CB
framework = arduino
upload_protocol = dfu
;upload_protocol = stlink

lib_archive = false

build_flags = 
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBCON
	-D USBD_VID=0x0483
	-D USBD_PID=0x5740
	-D USB_MANUFACTURER="Unknown"
	-D USB_PRODUCT="\"G4321\""
	-D HAL_PCD_MODULE_ENABLED

    -D HSE_VALUE=16000000UL   ; 16 MHz HSE
    -D USE_HSE_CLOCK         ; force HSE as clock source

	-D HAL_FDCAN_MODULE_ENABLED
	-D HAL_CORDIC_MODULE_ENABLED

    -D ARDUINO_NUCLEO_G431KB ; Needed to get the ACANFD library to compile
	

lib_deps = 
	askuric/Simple FOC@^2.3.4
	simplefoc/SimpleFOCDrivers@^1.0.8
	pierremolinaro/ACANFD_STM32 @ 1.1.2-rc1

