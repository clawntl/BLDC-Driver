; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = driver

; Shared settings applied to every [env:*] below (PlatformIO merges this
; automatically).
;
; One firmware image serves both motor drivers: which side a board drives
; (CAN IDs), the direction invert and the stored FOC alignment are saved in
; flash and set over USB serial (`help` in the serial monitor), see
; src/board_settings.h and src/serial_console.h.
;   pio run -e driver -t upload
[env]
platform = ststm32@19.7.1
board = genericSTM32G431CB
framework = arduino
upload_protocol = dfu
;upload_protocol = stlink

lib_archive = false

; src/motor_test/ holds the bench-test firmware; keep it out of the real builds.
build_src_filter = +<*> -<motor_test/>

build_flags =
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBCON
	-D USBD_VID=0x0483
	-D USBD_PID=0x5740
	-D USB_MANUFACTURER="Unknown"
	-D USB_PRODUCT="\"G4321\""
	-D HAL_PCD_MODULE_ENABLED
	-D HAL_FDCAN_MODULE_ENABLED
	-D HAL_CORDIC_MODULE_ENABLED

	-DHSE_VALUE=16000000

	-D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF

	; analogRead() sample time. The core's default (12.5 cycles) is too short
	; for the ~9 kohm V_SENS divider with no filter cap, which reads low.
	; Only affects analogRead(); SimpleFOC configures its own ADC settings.
	-D ADC_SAMPLINGTIME=ADC_SAMPLETIME_247CYCLES_5

; Pinned to the exact versions this was developed/tested against, so a new
; library release can't silently change the build.
lib_deps =
	askuric/Simple FOC@2.4.0
	simplefoc/SimpleFOCDrivers@1.0.9

[env:driver]
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF


; Bench/bring-up test firmware (USB serial console, no CAN). Shares pins.h,
; motor_config.h, clock_config.cpp and dfu.cpp with the real firmware.
;   pio run -e motor_test -t upload      then open the serial monitor, type `help`
; Reflash `driver` afterwards (type `dfu` in the console to enter DFU).
[env:motor_test]
build_src_filter = +<motor_test/> +<clock_config.cpp> +<dfu.cpp> +<supply_voltage.cpp>
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
