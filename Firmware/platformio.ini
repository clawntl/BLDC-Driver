; PlatformIO Project Configuration File
;
; One source tree for several STM32G431 + DRV8316 boards. Each board is a
; folder in boards/ with
;   board_config.h  pins, parts and hardware constants, found through
;                   -I boards/<name> (not "board.h": the STM32 core has one)
;   board.ini       its build environments: <name> (firmware) and <name>_test
;                   (bench-test firmware), pulled in by extra_configs below.
; Adding a board never needs a change here. See docs/firmware.md#boards.
;
;   pio run -e bldc_driver_v02 -t upload
;   pio run -e minifoc_mk2 -t upload
;
; One firmware image serves every board of a type: the node ID, the direction
; invert and the stored FOC alignment are saved in flash and set over USB
; serial (`help` in the serial monitor) or CAN, see src/board_settings.h.

[platformio]
default_envs = bldc_driver_v02
extra_configs = boards/*/board.ini

; Shared by every environment (PlatformIO merges [env] into each [env:*]).
[env]
platform = ststm32@19.7.1
board = genericSTM32G431CB
framework = arduino
upload_protocol = dfu
;upload_protocol = stlink

lib_archive = false

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF

; Pinned to the exact versions this was developed/tested against, so a new
; library release can't silently change the build.
lib_deps =
	askuric/Simple FOC@2.4.0
	simplefoc/SimpleFOCDrivers@1.0.9

; Base for the board environments in boards/*/board.ini.
[board_firmware]
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBCON
	-D USBD_VID=0x0483
	-D USBD_PID=0x5740
	-D USB_MANUFACTURER="Unknown"
	-D HAL_PCD_MODULE_ENABLED
	-D HAL_FDCAN_MODULE_ENABLED
	-D HAL_CORDIC_MODULE_ENABLED

	-DHSE_VALUE=16000000

	-D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF

; Unused library code left out of the image (see the script).
extra_scripts = pre:scripts/skip_unused_lib_sources.py

; The real firmware: src/ without the bench-test folder.
build_src_filter = +<*> -<motor_test/>

; Bench/bring-up test firmware (USB serial console, no CAN). Shares the board
; header, motor_config.h, src/hw/, src/parts/, clock_config.cpp and dfu.cpp
; with the real firmware.
;   pio run -e <board>_test -t upload      then open the serial monitor, type `help`
; Reflash the board's firmware environment afterwards (type `dfu` to enter DFU).
test_src_filter = +<motor_test/> +<clock_config.cpp> +<dfu.cpp> +<hw/> +<parts/>
