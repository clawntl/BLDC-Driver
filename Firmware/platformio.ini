; PlatformIO Project Configuration File
;
; One source tree, one environment per board. Each board environment sets
; -D BOARD_<NAME>, which selects include/boards/<name>.h through board.h
; (pins, fitted parts, hardware constants). See docs/firmware.md.
;
;   Board                       Firmware            Bench test
;   BLDC-Driver v0.2            bldc_driver_v02     bldc_driver_v02_test
;   MiniFOC Mk2                 minifoc_mk2         minifoc_mk2_test
;
;   pio run -e bldc_driver_v02 -t upload
;
; One firmware image serves every board of a type: the node ID, the direction
; invert and the stored FOC alignment are saved in flash and set over USB
; serial (`help` in the serial monitor) or CAN, see src/board_settings.h.

[platformio]
default_envs = bldc_driver_v02

; Shared by every environment (PlatformIO merges [env] into each [env:*]).
[env]
platform = ststm32@19.7.1
board = genericSTM32G431CB
framework = arduino
upload_protocol = dfu
;upload_protocol = stlink

lib_archive = false

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF

; Pinned to the exact versions this was developed/tested against, so a new
; library release can't silently change the build.
lib_deps =
	askuric/Simple FOC@2.4.0
	simplefoc/SimpleFOCDrivers@1.0.9

; Flags for every board. Board environments add -D BOARD_..., USB_PRODUCT
; and anything else their hardware needs.
[common]
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBCON
	-D USBD_VID=0x0483
	-D USBD_PID=0x5740
	-D USB_MANUFACTURER="Unknown"
	-D HAL_PCD_MODULE_ENABLED
	-D HAL_FDCAN_MODULE_ENABLED
	-D HAL_CORDIC_MODULE_ENABLED

	-DHSE_VALUE=16000000

	-D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF

; The real firmware: src/ without the bench-test folder.
firmware_src_filter = +<*> -<motor_test/>

; Bench/bring-up test firmware (USB serial console, no CAN). Shares the board
; header, motor_config.h, src/hw/, clock_config.cpp and dfu.cpp with the real
; firmware.
;   pio run -e <board>_test -t upload      then open the serial monitor, type `help`
; Reflash the board's firmware environment afterwards (type `dfu` to enter DFU).
test_src_filter = +<motor_test/> +<clock_config.cpp> +<dfu.cpp> +<hw/>

; ---- BLDC-Driver v0.2 --------------------------------------------------------

[bldc_driver_v02]
build_flags =
	${common.build_flags}
	-D BOARD_BLDC_DRIVER_V02
	-D USB_PRODUCT="\"G4321\""
	; analogRead() sample time. The core's default (12.5 cycles) is too short
	; for the ~9 kohm V_SENS divider with no filter cap, which reads low.
	; Only affects analogRead(); SimpleFOC's low-side current sense
	; configures its own ADC settings.
	-D ADC_SAMPLINGTIME=ADC_SAMPLETIME_247CYCLES_5

[env:bldc_driver_v02]
build_flags = ${bldc_driver_v02.build_flags}
build_src_filter = ${common.firmware_src_filter}

[env:bldc_driver_v02_test]
build_flags = ${bldc_driver_v02.build_flags}
build_src_filter = ${common.test_src_filter}

; ---- MiniFOC Mk2 -------------------------------------------------------------

[minifoc_mk2]
build_flags =
	${common.build_flags}
	-D BOARD_MINIFOC_MK2
	-D USB_PRODUCT="\"MiniFOC\""
	; No ADC_SAMPLINGTIME override: SimpleFOC's InlineCurrentSense reads the
	; phases with analogRead() on STM32, so a long sample time would slow the
	; FOC loop (and the INA241 outputs are low impedance anyway).

[env:minifoc_mk2]
build_flags = ${minifoc_mk2.build_flags}
build_src_filter = ${common.firmware_src_filter}

[env:minifoc_mk2_test]
build_flags = ${minifoc_mk2.build_flags}
build_src_filter = ${common.test_src_filter}
