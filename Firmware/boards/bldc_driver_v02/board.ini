; BLDC-Driver v0.2. Included by platformio.ini (extra_configs = boards/*/board.ini).

[env:bldc_driver_v02]
extends = board_firmware
build_flags =
	${board_firmware.build_flags}
	-I boards/bldc_driver_v02
	-D USB_PRODUCT="\"G4321\""
	; analogRead() sample time. The core's default (12.5 cycles) is too short
	; for the ~9 kohm V_SENS divider with no filter cap, which reads low.
	; Only affects analogRead(); SimpleFOC's low-side current sense
	; configures its own ADC settings.
	-D ADC_SAMPLINGTIME=ADC_SAMPLETIME_247CYCLES_5

[env:bldc_driver_v02_test]
extends = env:bldc_driver_v02
build_src_filter = ${board_firmware.test_src_filter}
